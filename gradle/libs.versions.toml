# Single source of truth for JVM versions. See docs/adr/0001-pin-tool-versions.md.
# Versions managed by the Spring Boot BOM (Kafka, Flyway, Postgres driver, Testcontainers,
# JUnit, Jackson, Micrometer) are deliberately NOT listed here — the BOM pins them.

[versions]
java = "21"
spring-boot = "4.0.8"
spring-cloud = "2025.1.3"
spring-dependency-management = "1.1.7"
fabric8 = "8.0.0"
springdoc = "3.1.1"
mapstruct = "1.6.3"
opentelemetry-javaagent = "2.32.0"
# The runner's JUnit extension runs inside *target* repos, which are on JUnit 5,
# so it compiles against Jupiter 5 instead of the JUnit 6 that Spring Boot 4 brings.
junit5-runner = "5.14.4"

[libraries]
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
fabric8-bom = { module = "io.fabric8:kubernetes-client-bom", version.ref = "fabric8" }
fabric8-client = { module = "io.fabric8:kubernetes-client" }
springdoc-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
springdoc-webflux = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
opentelemetry-javaagent = { module = "io.opentelemetry.javaagent:opentelemetry-javaagent", version.ref = "opentelemetry-javaagent" }
junit5-runner-bom = { module = "org.junit:junit-bom", version.ref = "junit5-runner" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
