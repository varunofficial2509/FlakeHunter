name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            gateway
            project
            orchestrator
            aggregator
            agent
            runner
            web
            events
            helm
            k8s
            infra
            ci
            docs
            deps
            repo
            benchmark
            observability
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: "Start the subject with a lowercase letter, e.g. feat(orchestrator): create runner Jobs"
