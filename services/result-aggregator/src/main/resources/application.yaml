spring:
  application:
    name: result-aggregator
  datasource:
    # Local defaults match deploy/compose; override with SPRING_DATASOURCE_* env vars.
    url: jdbc:postgresql://localhost:5432/flakehunter
    username: flakehunter
    password: flakehunter
  flyway:
    # This service owns only the "results" schema (tech doc section 7).
    schemas: results
    default-schema: results
  kafka:
    bootstrap-servers: localhost:9092
    # Kafka records carry the W3C traceparent header, so one trace follows an event across services.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      group-id: result-aggregator
      auto-offset-reset: earliest # a new group must not skip results sent before it started
    producer:
      # Tech doc section 6: a send counts only once every replica has it, and retries never duplicate.
      acks: all
      properties:
        enable.idempotence: true
  mvc:
    problemdetails:
      enabled: true # Errors as RFC 7807 problem details.

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus # Prometheus scrapes this inside the cluster; the ingress only routes /api
  tracing:
    sampling:
      probability: 1.0 # one user and few requests: keep every trace
    # Spans go to Tempo only where MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set (the Helm chart).
  observations:
    enable:
      tasks.scheduled: false # a trace for every 1 s outbox poll would bury the real ones
