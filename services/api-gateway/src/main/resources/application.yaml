spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: projects
              uri: ${PROJECT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/projects/**
            - id: hunts
              uri: ${HUNT_ORCHESTRATOR_URL:http://localhost:8082}
              predicates:
                - Path=/api/hunts/**,/api/admin/**
            - id: findings
              uri: ${RESULT_AGGREGATOR_URL:http://localhost:8083}
              predicates:
                - Path=/api/findings/**

# Single-user login (tech doc section 5). No defaults for secrets: the gateway refuses to start without them.
flakehunter:
  admin:
    username: ${FLAKEHUNTER_ADMIN_USER:admin}
    password: ${FLAKEHUNTER_ADMIN_PASSWORD}
  jwt:
    secret: ${FLAKEHUNTER_JWT_SECRET}
    ttl: 8h

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus # Prometheus scrapes this inside the cluster; the ingress only routes /api
  tracing:
    sampling:
      probability: 1.0 # one user and few requests: keep every trace
    # Spans go to Tempo only where MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set (the Helm chart).
  observations:
    enable:
      tasks.scheduled: false # a trace for every 1 s outbox poll would bury the real ones
      spring.security: false # its filter-chain spans would still trace every probe (see ApiGatewayApplication)
