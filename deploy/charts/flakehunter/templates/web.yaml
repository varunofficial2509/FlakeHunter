apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      enableServiceLinks: false
      containers:
        - name: web
          image: "{{ .Values.image.registry }}/flakehunter/web:{{ required "image.tag" .Values.image.tag }}"
          ports:
            - containerPort: 80
          resources:
            requests: { memory: {{ .Values.web.memory }}, cpu: 10m }
            limits: { memory: {{ .Values.web.memory }} }
          readinessProbe:
            httpGet: { path: /, port: 80 }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports:
    - port: 80
---
# k3s ships Traefik as the ingress controller. /api goes to the gateway, /grafana to Grafana, the rest to the web app: one origin, no CORS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flakehunter
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 8080 } }
          - path: /grafana
            pathType: Prefix
            backend:
              service: { name: grafana, port: { number: 3000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 80 } }
