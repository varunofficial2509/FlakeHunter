{{- /* Grafana at http://localhost:8090/grafana. Datasource and dashboards come from git, not from clicks. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus:9090
        isDefault: true
      - name: Tempo
        uid: tempo
        type: tempo
        url: http://tempo:3200
      # The hunts and AI dashboards read the services' tables directly, as a role that can only read.
      - name: Postgres
        uid: postgres
        type: grafana-postgresql-datasource
        url: postgres:5432
        user: grafana_reader
        jsonData: { database: flakehunter, sslmode: disable, postgresVersion: 1600, maxOpenConns: 2 }
        secureJsonData: { password: $POSTGRES_PASSWORD }
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: flakehunter
        type: file
        options: { path: /var/lib/grafana/dashboards } # rescanned every 10 s, so dashboard edits need no restart
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  platform.json: |-
{{ .Files.Get "files/platform-dashboard.json" | indent 4 }}
  hunts.json: |-
{{ .Files.Get "files/hunts-dashboard.json" | indent 4 }}
  ai.json: |-
{{ .Files.Get "files/ai-dashboard.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: { app: grafana }
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: grafana
          image: {{ required "grafana.image" .Values.grafana.image }}
          env:
            - { name: GF_SERVER_ROOT_URL, value: "%(protocol)s://%(domain)s:%(http_port)s/grafana/" }
            - { name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true" }
            # Anyone who reaches localhost:8090 may look; changing things needs the admin login.
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: admin-password } }
            - name: POSTGRES_PASSWORD # for grafana_reader, read by datasources.yaml
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: postgres-password } }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/platform.json }
            - { name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true" } # no plugin downloads at startup; core ones suffice
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false" }
          ports:
            - containerPort: 3000
          resources:
            requests: { memory: {{ .Values.grafana.memory }}, cpu: 50m }
            limits: { memory: {{ .Values.grafana.memory }} }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
          volumeMounts:
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
      volumes:
        - name: provisioning
          configMap: { name: grafana-provisioning }
        - name: dashboards
          configMap: { name: grafana-dashboards }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector: { app: grafana }
  ports:
    - port: 3000
---
# The read-only role the Postgres datasource logs in as. Anonymous viewers can send it any query, so it may only
# read (pg_read_all_data, read-only transactions) and each query stops after 10 s.
# shortcut: it shares the owner's password from the secret; give it its own key if anyone else gets access.
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-db-reader
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: {{ .Values.postgres.image }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              psql -v ON_ERROR_STOP=1 -v pw="$PGPASSWORD" <<'SQL'
              SELECT 'CREATE ROLE grafana_reader' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'grafana_reader')\gexec
              ALTER ROLE grafana_reader LOGIN PASSWORD :'pw';
              GRANT pg_read_all_data TO grafana_reader;
              ALTER ROLE grafana_reader SET default_transaction_read_only = on;
              ALTER ROLE grafana_reader SET statement_timeout = '10s';
              SQL
          env:
            - { name: PGHOST, value: postgres }
            - { name: PGUSER, value: flakehunter }
            - { name: PGDATABASE, value: flakehunter }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: postgres-password } }
          resources:
            limits: { memory: 64Mi }
