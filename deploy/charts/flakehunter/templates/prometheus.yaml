{{- /* Scrapes every pod in this namespace that has the prometheus.io/scrape annotation (templates/services.yaml). */}}
{{- define "flakehunter.prometheus-config" }}
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: pods
    kubernetes_sd_configs:
      - role: pod
        namespaces: { names: [{{ .Release.Namespace }}] }
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      # One target per declared port; this skips init containers such as wait-for-postgres.
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: .+
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        target_label: __metrics_path__
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
data:
  prometheus.yml: |
{{- include "flakehunter.prometheus-config" . | indent 4 }}
---
# Finding the pods needs the Kubernetes API: read-only, pods only, this namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
subjects:
  - { kind: ServiceAccount, name: prometheus, namespace: {{ .Release.Namespace }} }
roleRef:
  { apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: { app: prometheus }
spec:
  replicas: 1
  strategy: { type: Recreate } # two Prometheus pods can't share one data directory
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
      annotations:
        checksum/config: {{ include "flakehunter.prometheus-config" . | sha256sum }} # restart on a config change
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: {{ required "prometheus.image" .Values.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
          ports:
            - containerPort: 9090
          resources:
            requests: { memory: {{ .Values.prometheus.memory }}, cpu: 50m }
            limits: { memory: {{ .Values.prometheus.memory }} }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus }
        # shortcut: history is lost when the pod restarts; use a PVC if you want metrics across restarts.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector: { app: prometheus }
  ports:
    - port: 9090
